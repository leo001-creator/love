<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V+D Širdelė (Patobulinta)</title>
<style>
  /* Pagrindinis išdėstymas */
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #4b185e, #1f0b40);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  /* SVG širdies konteineris */
  .heart-svg {
    position: relative;
    width: min(80vmin, 300px);
    height: min(80vmin, 300px);
  }

  /* SVG širdies kelias */
  #heart-path {
    transform-origin: center;
    fill: #ff3366;
    /* Animacija: dvi pulsacijos */
    animation: heartbeat 1.2s infinite ease-in-out;
    filter: drop-shadow(0 0 20px rgba(255,51,102,0.6));
  }

  /* Širdies viduje esantis tekstas */
  #heart-text {
    font-size: 2rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* Kad tekstas atsidurtų virš SVG širdies */
    z-index: 10;
    white-space: nowrap;
  }

  /* Pulsavimo animacijos raktiniai kadrai */
  @keyframes heartbeat {
    0%, 100% {
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(255,51,102,0.6));
    }
    20% {
      transform: scale(1.3);
      filter: drop-shadow(0 0 40px rgba(255,51,102,0.9));
    }
    40% {
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(255,51,102,0.6));
    }
    60% {
      transform: scale(1.15);
      filter: drop-shadow(0 0 30px rgba(255,51,102,0.8));
    }
    80% {
      transform: scale(1);
      filter: drop-shadow(0 0 20px rgba(255,51,102,0.6));
    }
  }

  /* Partiklių efektas - CSS animacija */
  .particle {
    position: absolute;
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    to {
      transform: translateY(-100px) scale(0);
      opacity: 0;
    }
  }

  /* Prefers-reduced-motion taisyklė */
  @media (prefers-reduced-motion: reduce) {
    #heart-path, .particle {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<!-- SVG širdelė su tekstu viduje -->
<div class="heart-svg">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Pagrindinis širdies kelias (pagal Pd4u „Perfect Heart“) -->
    <path id="heart-path"
          d="M0 200 V100 A100,100 90 0,1 200,100 V200 A100,100 90 0,1 0,200 Z">
    </path>
    <!-- Tekstas centre -->
    <text id="heart-text" x="50%" y="50%" dy="0.35em" text-anchor="middle">
      V+D = ŠIRDELĖ
    </text>
  </svg>
</div>

<script>
  // Spustelėjimo efektas: sukuria kelias daleles
  document.addEventListener('click', function(e) {
    for(let i=0; i<8; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      document.body.appendChild(particle);
      // Išstatome įvykį mokyti per pageidavimą ekrano koordinates
      particle.style.left = (e.clientX + (Math.random()-0.5)*40) + 'px';
      particle.style.top = (e.clientY + (Math.random()-0.5)*40) + 'px';
      // Pašaliname po animacijos pabaigos
      particle.addEventListener('animationend', () => {
        particle.remove();
      });
    }
  });
</script>

</body>
</html>
