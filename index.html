<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09000d">

<title>V + D ❤️</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #08040d;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene {
    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 40, 110, 0.13) 0%,
            rgba(150, 20, 90, 0.08) 25%,
            rgba(20, 5, 25, 0.95) 65%,
            #050308 100%
        );
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.scene::before {
    content: "";

    position: absolute;

    width: min(80vw, 850px);
    height: min(80vw, 850px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 30, 110, 0.22),
            rgba(255, 30, 110, 0.08) 35%,
            transparent 70%
        );

    filter: blur(40px);

    animation: ambientGlow 6s ease-in-out infinite;

    pointer-events: none;
}

@keyframes ambientGlow {

    0%,
    100% {
        transform: scale(0.88);
        opacity: 0.55;
    }

    50% {
        transform: scale(1.12);
        opacity: 1;
    }
}


/* =========================================================
   STARS
========================================================= */

.stars {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 14px rgba(255,90,170,0.8);

    animation: starTwinkle 2.5s ease-in-out infinite;
}

.star:nth-child(1)  { left: 8%;  top: 15%; animation-delay: .1s; }
.star:nth-child(2)  { left: 16%; top: 72%; animation-delay: 1.1s; }
.star:nth-child(3)  { left: 25%; top: 26%; animation-delay: .6s; }
.star:nth-child(4)  { left: 36%; top: 11%; animation-delay: 1.6s; }
.star:nth-child(5)  { left: 50%; top: 18%; animation-delay: .8s; }
.star:nth-child(6)  { left: 64%; top: 80%; animation-delay: 1.9s; }
.star:nth-child(7)  { left: 75%; top: 23%; animation-delay: .3s; }
.star:nth-child(8)  { left: 87%; top: 65%; animation-delay: 1.3s; }
.star:nth-child(9)  { left: 94%; top: 34%; animation-delay: .9s; }
.star:nth-child(10) { left: 72%; top: 48%; animation-delay: 2s; }
.star:nth-child(11) { left: 13%; top: 43%; animation-delay: 1.5s; }
.star:nth-child(12) { left: 90%; top: 87%; animation-delay: .4s; }

@keyframes starTwinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-hearts {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.float-heart {
    position: absolute;

    bottom: -50px;

    color: rgba(255, 80, 145, 0.35);

    font-size: 18px;

    filter:
        drop-shadow(0 0 8px rgba(255, 30, 110, 0.6));

    animation:
        floatingHeart linear infinite;
}

@keyframes floatingHeart {

    0% {
        transform:
            translate3d(0, 0, 0)
            scale(.7)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    50% {
        transform:
            translate3d(
                20px,
                -50vh,
                0
            )
            scale(1)
            rotate(8deg);
    }

    100% {
        transform:
            translate3d(
                -20px,
                -115vh,
                0
            )
            scale(.8)
            rotate(-8deg);

        opacity: 0;
    }
}


/* =========================================================
   CENTER CONTENT
========================================================= */

.content {
    position: relative;

    width: min(92vw, 720px);
    height: min(92vw, 720px);

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 5;
}


/* =========================================================
   HEART STAGE
========================================================= */

.heart-stage {
    position: relative;

    width: min(80vw, 430px);
    aspect-ratio: 1 / 1;

    display: flex;
    justify-content: center;
    align-items: center;

    isolation: isolate;
}


/* =========================================================
   OUTER AURA
========================================================= */

.heart-aura {
    position: absolute;

    width: 78%;
    height: 78%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 40, 120, 0.20),
            rgba(255, 40, 120, 0.07) 40%,
            transparent 70%
        );

    filter: blur(20px);

    animation: auraAnimation 2.4s ease-in-out infinite;

    z-index: 0;
}

@keyframes auraAnimation {

    0%,
    100% {
        transform: scale(.95);
        opacity: .55;
    }

    50% {
        transform: scale(1.18);
        opacity: 1;
    }
}


/* =========================================================
   HEART HOLDER
========================================================= */

.heart-motion {
    position: absolute;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: floatingMotion 4.8s ease-in-out infinite;

    z-index: 2;
}

@keyframes floatingMotion {

    0%,
    100% {
        transform: translateY(0) rotate(0deg);
    }

    25% {
        transform: translateY(-5px) rotate(-0.8deg);
    }

    50% {
        transform: translateY(2px) rotate(0.4deg);
    }

    75% {
        transform: translateY(-3px) rotate(0.8deg);
    }
}


/* =========================================================
   SVG
========================================================= */

.heart-svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   HEART SHADOW / GLOW
========================================================= */

.heart-glow {
    animation:
        glowPulse 1.25s cubic-bezier(.42,0,.24,1) infinite;
}

@keyframes glowPulse {

    0%,
    100% {
        opacity: .45;
        transform: scale(1);
    }

    12% {
        opacity: 1;
        transform: scale(1.06);
    }

    28% {
        opacity: .55;
        transform: scale(.985);
    }

    40% {
        opacity: .85;
        transform: scale(1.035);
    }

    56% {
        opacity: .4;
        transform: scale(1);
    }

    100% {
        opacity: .45;
        transform: scale(1);
    }
}


/* =========================================================
   MAIN HEART
========================================================= */

.heart-core {
    transform-box: fill-box;
    transform-origin: center;

    animation:
        heartbeatMorph 1.25s cubic-bezier(.42,0,.22,1) infinite;
}

@keyframes heartbeatMorph {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);
    }

    8% {
        transform:
            translateY(1px)
            scale(1.04);
    }

    17% {
        transform:
            translateY(-1px)
            scale(1.12);
    }

    29% {
        transform:
            translateY(1px)
            scale(.99);
    }

    40% {
        transform:
            translateY(-1px)
            scale(1.055);
    }

    53% {
        transform:
            translateY(0)
            scale(1);
    }

    100% {
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   HEART HIGHLIGHT
========================================================= */

.heart-highlight {
    animation:
        highlightMove 2.8s ease-in-out infinite;
}

@keyframes highlightMove {

    0% {
        transform:
            translate(-18px, -8px)
            rotate(-15deg)
            scale(.9);

        opacity: .15;
    }

    50% {
        transform:
            translate(10px, 8px)
            rotate(-12deg)
            scale(1.08);

        opacity: .4;
    }

    100% {
        transform:
            translate(35px, 22px)
            rotate(-10deg)
            scale(1);

        opacity: .05;
    }
}


/* =========================================================
   TEXT
========================================================= */

.heart-text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 85%;

    text-align: center;

    z-index: 20;

    pointer-events: none;

    color: #fff;

    font-size: clamp(19px, 4.8vw, 28px);

    font-weight: 900;

    letter-spacing: .5px;

    line-height: 1.1;

    white-space: nowrap;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35),
        0 0 8px rgba(255,255,255,.5),
        0 0 22px rgba(255,170,205,.45);

    animation:
        textBreath 2.8s ease-in-out infinite;
}

@keyframes textBreath {

    0%,
    100% {
        opacity: .92;
        filter: brightness(.98);
    }

    50% {
        opacity: 1;
        filter: brightness(1.12);
    }
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkles {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 30;
}

.sparkle {
    position: absolute;

    color: white;

    font-size: 22px;

    text-shadow:
        0 0 8px white,
        0 0 20px rgba(255,70,150,.8);

    animation:
        sparkleAnimation 2.2s ease-in-out infinite;
}

.sparkle:nth-child(1) {
    left: 19%;
    top: 29%;
}

.sparkle:nth-child(2) {
    right: 17%;
    top: 34%;

    animation-delay: .6s;
}

.sparkle:nth-child(3) {
    left: 23%;
    bottom: 25%;

    font-size: 14px;

    animation-delay: 1.2s;
}

.sparkle:nth-child(4) {
    right: 25%;
    bottom: 28%;

    font-size: 14px;

    animation-delay: 1.7s;
}

@keyframes sparkleAnimation {

    0%,
    100% {
        opacity: .1;
        transform: scale(.5) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: scale(1.4) rotate(20deg);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particle-layer {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 50;
}

.particle {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 16px rgba(255,70,150,.8);

    pointer-events: none;

    animation:
        particleAnimation .9s ease-out forwards;
}

@keyframes particleAnimation {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(0);

        opacity: 0;
    }
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.caption {

    position: absolute;

    bottom: 28px;

    left: 50%;

    transform: translateX(-50%);

    width: calc(100% - 30px);

    text-align: center;

    color: rgba(255,255,255,.45);

    font-size: 11px;

    letter-spacing: 4px;

    text-transform: uppercase;

    user-select: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .content {
        width: 100vw;
        height: 100vw;
    }

    .heart-stage {
        width: min(88vw, 390px);
    }

    .heart-text {
        font-size: clamp(17px, 5vw, 24px);
    }

    .caption {
        bottom: 20px;
        letter-spacing: 3px;
    }
}


/* =========================================================
   SMALL HEIGHT SCREENS
========================================================= */

@media (max-height: 600px) {

    .heart-stage {
        width: min(62vh, 380px);
    }

    .caption {
        bottom: 10px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .heart-motion,
    .heart-core,
    .heart-glow,
    .heart-highlight,
    .heart-text,
    .heart-aura,
    .sparkle,
    .float-heart,
    .star {
        animation: none !important;
    }
}

</style>
</head>


<body>

<div class="scene">

    <!-- STARS -->
    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>


    <!-- FLOATING HEARTS -->
    <div class="floating-hearts" id="floatingHearts"></div>


    <!-- MAIN CONTENT -->
    <main class="content">

        <div class="heart-stage">

            <!-- AURA -->
            <div class="heart-aura"></div>


            <!-- SPARKLES -->
            <div class="sparkles">

                <div class="sparkle">✦</div>
                <div class="sparkle">✦</div>
                <div class="sparkle">✧</div>
                <div class="sparkle">✧</div>

            </div>


            <!-- HEART -->
            <div class="heart-motion">

                <svg
                    class="heart-svg"
                    viewBox="0 0 200 190"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <defs>

                        <!-- MAIN GRADIENT -->
                        <linearGradient
                            id="heartGradient"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop
                                offset="0%"
                                stop-color="#ff6a9d"
                            />

                            <stop
                                offset="35%"
                                stop-color="#ff2d6f"
                            />

                            <stop
                                offset="70%"
                                stop-color="#ff0f5f"
                            />

                            <stop
                                offset="100%"
                                stop-color="#d9004f"
                            />
                        </linearGradient>


                        <!-- INNER LIGHT -->
                        <radialGradient
                            id="innerGradient"
                            cx="38%"
                            cy="28%"
                        >

                            <stop
                                offset="0%"
                                stop-color="#ffffff"
                                stop-opacity=".38"
                            />

                            <stop
                                offset="35%"
                                stop-color="#ffffff"
                                stop-opacity=".08"
                            />

                            <stop
                                offset="100%"
                                stop-color="#ffffff"
                                stop-opacity="0"
                            />

                        </radialGradient>


                        <!-- GLOW -->
                        <filter
                            id="glow"
                            x="-80%"
                            y="-80%"
                            width="260%"
                            height="260%"
                        >

                            <feGaussianBlur
                                stdDeviation="9"
                                result="blur"
                            />

                        </filter>


                        <!-- SOFT SHADOW -->
                        <filter
                            id="softShadow"
                            x="-60%"
                            y="-60%"
                            width="220%"
                            height="220%"
                        >

                            <feDropShadow
                                dx="0"
                                dy="7"
                                stdDeviation="7"
                                flood-color="#ff1467"
                                flood-opacity=".38"
                            />

                        </filter>


                        <!-- HEART PATH -->
                        <path
                            id="heartShape"
                            d="
                                M100 174
                                C84 158 27 125 20 77
                                C15 43 35 20 63 20
                                C82 20 95 31 100 48
                                C105 31 118 20 137 20
                                C165 20 185 43 180 77
                                C173 125 116 158 100 174
                                Z
                            "
                        />

                    </defs>


                    <!-- OUTER GLOW -->
                    <use
                        href="#heartShape"
                        class="heart-glow"
                        fill="#ff2b70"
                        filter="url(#glow)"
                        opacity=".7"
                    />


                    <!-- MAIN HEART -->
                    <g class="heart-core">

                        <use
                            href="#heartShape"
                            fill="url(#heartGradient)"
                            filter="url(#softShadow)"
                        />

                        <!-- INNER LIGHT -->
                        <use
                            href="#heartShape"
                            fill="url(#innerGradient)"
                        />


                        <!-- TOP HIGHLIGHT -->
                        <ellipse
                            class="heart-highlight"
                            cx="72"
                            cy="50"
                            rx="34"
                            ry="12"
                            fill="white"
                            opacity=".16"
                            transform="rotate(-25 72 50)"
                        />

                    </g>

                </svg>

            </div>


            <!-- TEXT -->
            <div class="heart-text">
                V + D = ŠIRDELĖ
            </div>

        </div>

    </main>


    <!-- BOTTOM CAPTION -->
    <div class="caption">
        forever & always
    </div>


    <!-- CLICK PARTICLES -->
    <div
        class="particle-layer"
        id="particleLayer"
    ></div>

</div>


<script>

/* =========================================================
   FLOATING HEART GENERATOR
========================================================= */

const floatingContainer =
    document.getElementById("floatingHearts");

const floatingCount = 18;

for (let i = 0; i < floatingCount; i++) {

    const heart =
        document.createElement("div");

    heart.className = "float-heart";

    heart.textContent =
        Math.random() > .45
            ? "♥"
            : "♡";

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        (12 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (8 + Math.random() * 8) + "s";

    heart.style.animationDelay =
        Math.random() * 10 + "s";

    floatingContainer.appendChild(heart);
}


/* =========================================================
   CLICK PARTICLES
========================================================= */

const particleLayer =
    document.getElementById("particleLayer");

let activeParticles = 0;

document.addEventListener("pointerdown", (event) => {

    /* limitas apsaugai nuo labai greitų paspaudimų */
    if (activeParticles > 80) {
        return;
    }

    const amount = 10;

    for (let i = 0; i < amount; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            40 + Math.random() * 120;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        particle.style.left =
            event.clientX + "px";

        particle.style.top =
            event.clientY + "px";

        particle.style.setProperty(
            "--x",
            x + "px"
        );

        particle.style.setProperty(
            "--y",
            y + "px"
        );

        const size =
            4 + Math.random() * 7;

        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";

        particleLayer.appendChild(particle);

        activeParticles++;

        particle.addEventListener(
            "animationend",
            () => {

                particle.remove();

                activeParticles--;

            },
            {
                once: true
            }
        );
    }
});


/* =========================================================
   HEART CLICK EXTRA EFFECT
========================================================= */

const heartStage =
    document.querySelector(".heart-stage");

heartStage.addEventListener("pointerdown", () => {

    heartStage.animate(
        [
            {
                filter: "brightness(1)"
            },

            {
                filter: "brightness(1.35)"
            },

            {
                filter: "brightness(1)"
            }
        ],
        {
            duration: 350,
            easing: "ease-out"
        }
    );

});


/* =========================================================
   PREVENT DOUBLE-TAP ZOOM ON MOBILE
========================================================= */

document.addEventListener(
    "dblclick",
    (event) => {
        event.preventDefault();
    }
);

</script>

</body>
</html>
