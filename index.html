<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V + D ❤️</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 45%, #30102d 0%, #13091b 35%, #05050d 75%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.background-glow {
    position: fixed;
    width: 700px;
    height: 700px;

    background:
        radial-gradient(
            circle,
            rgba(255, 40, 120, 0.22),
            rgba(150, 30, 120, 0.08) 40%,
            transparent 70%
        );

    filter: blur(40px);

    animation: backgroundPulse 4s ease-in-out infinite;

    pointer-events: none;
}

@keyframes backgroundPulse {

    0%,
    100% {
        transform: scale(0.9);
        opacity: 0.65;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}


/* =========================================================
   STARS
========================================================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 6px white,
        0 0 12px rgba(255, 120, 200, 0.8);

    animation: twinkle 2s ease-in-out infinite;
}

.star:nth-child(1)  { left: 8%;  top: 14%; animation-delay: .2s; }
.star:nth-child(2)  { left: 17%; top: 72%; animation-delay: .8s; }
.star:nth-child(3)  { left: 28%; top: 21%; animation-delay: 1.4s; }
.star:nth-child(4)  { left: 38%; top: 84%; animation-delay: .4s; }
.star:nth-child(5)  { left: 49%; top: 12%; animation-delay: 1.1s; }
.star:nth-child(6)  { left: 61%; top: 78%; animation-delay: .6s; }
.star:nth-child(7)  { left: 72%; top: 18%; animation-delay: 1.7s; }
.star:nth-child(8)  { left: 83%; top: 63%; animation-delay: .3s; }
.star:nth-child(9)  { left: 92%; top: 27%; animation-delay: 1.2s; }
.star:nth-child(10) { left: 14%; top: 42%; animation-delay: .9s; }
.star:nth-child(11) { left: 90%; top: 82%; animation-delay: .5s; }
.star:nth-child(12) { left: 67%; top: 45%; animation-delay: 1.8s; }

@keyframes twinkle {

    0%,
    100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.floating-heart {
    position: absolute;

    color: rgba(255, 80, 150, 0.45);

    font-size: 22px;

    filter:
        drop-shadow(0 0 8px rgba(255, 50, 130, .7));

    animation: floatHeart linear infinite;
}

.floating-heart:nth-child(1) {
    left: 10%;
    bottom: -50px;
    animation-duration: 9s;
}

.floating-heart:nth-child(2) {
    left: 24%;
    bottom: -80px;
    animation-duration: 12s;
    animation-delay: 2s;
}

.floating-heart:nth-child(3) {
    left: 72%;
    bottom: -60px;
    animation-duration: 10s;
    animation-delay: 1s;
}

.floating-heart:nth-child(4) {
    left: 88%;
    bottom: -90px;
    animation-duration: 13s;
    animation-delay: 4s;
}

.floating-heart:nth-child(5) {
    left: 55%;
    bottom: -70px;
    animation-duration: 11s;
    animation-delay: 3s;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(.7);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(-50vh)
            rotate(15deg)
            scale(1);
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(-15deg)
            scale(.8);

        opacity: 0;
    }
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {
    position: relative;

    width: min(92vw, 650px);
    height: min(85vh, 650px);

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 40px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.015)
        );

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6),
        inset 0 0 40px rgba(255,255,255,.02);

    overflow: hidden;
}


/* =========================================================
   CARD LIGHT
========================================================= */

.card::before {
    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    background:
        radial-gradient(
            circle,
            rgba(255, 30, 120, .13),
            transparent 70%
        );

    filter: blur(20px);

    animation: cardGlow 5s ease-in-out infinite;
}

@keyframes cardGlow {

    0%,
    100% {
        transform: translate(-120px, -80px);
    }

    50% {
        transform: translate(120px, 100px);
    }
}


/* =========================================================
   HEART AREA
========================================================= */

.heart-wrapper {
    position: relative;

    width: 330px;
    height: 330px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================================
   HEART
========================================================= */

.heart {
    position: relative;

    width: 190px;
    height: 190px;

    background:
        linear-gradient(
            135deg,
            #ff174f,
            #ff3975 45%,
            #ff0f63
        );

    transform: rotate(-45deg);

    border-radius: 12px;

    box-shadow:
        0 0 20px rgba(255, 30, 100, .8),
        0 0 50px rgba(255, 30, 100, .65),
        0 0 100px rgba(255, 30, 100, .4);

    animation:
        heartBeat 1.5s ease-in-out infinite;

    z-index: 5;
}


/* HEART TOPS */

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    background:
        linear-gradient(
            135deg,
            #ff174f,
            #ff3975 45%,
            #ff0f63
        );

    border-radius: 50%;
}

.heart::before {
    top: -95px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 95px;
}


/* =========================================================
   HEART HIGHLIGHT
========================================================= */

.heart-highlight {
    position: absolute;

    width: 65px;
    height: 25px;

    background: rgba(255,255,255,.35);

    border-radius: 50%;

    transform:
        rotate(-45deg)
        translate(-45px, -65px);

    filter: blur(4px);

    z-index: 7;

    animation: highlightMove 2s ease-in-out infinite;
}

@keyframes highlightMove {

    0%,
    100% {
        opacity: .25;
    }

    50% {
        opacity: .75;
    }
}


/* =========================================================
   HEART PULSE
========================================================= */

@keyframes heartBeat {

    0%,
    100% {
        transform:
            rotate(-45deg)
            scale(1);
    }

    15% {
        transform:
            rotate(-45deg)
            scale(1.08);
    }

    30% {
        transform:
            rotate(-45deg)
            scale(1);
    }

    45% {
        transform:
            rotate(-45deg)
            scale(1.05);
    }

    60% {
        transform:
            rotate(-45deg)
            scale(1);
    }
}


/* =========================================================
   TEXT
========================================================= */

.heart-text {

    position: absolute;

    z-index: 20;

    color: white;

    font-size: clamp(17px, 4vw, 25px);

    font-weight: 900;

    letter-spacing: 1px;

    text-align: center;

    white-space: nowrap;

    transform:
        translateY(4px);

    text-shadow:
        0 2px 5px rgba(0,0,0,.4),
        0 0 15px rgba(255,255,255,.5);

    animation: textGlow 2s ease-in-out infinite;
}

@keyframes textGlow {

    0%,
    100% {
        text-shadow:
            0 2px 5px rgba(0,0,0,.4),
            0 0 12px rgba(255,255,255,.35);
    }

    50% {
        text-shadow:
            0 2px 5px rgba(0,0,0,.4),
            0 0 25px rgba(255,255,255,.8);
    }
}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    position: absolute;

    bottom: 55px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 14px;

    color: rgba(255,255,255,.6);

    letter-spacing: 3px;

    text-transform: uppercase;

    animation: subtitleGlow 3s ease-in-out infinite;
}

@keyframes subtitleGlow {

    0%,
    100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   MINI SPARKLES
========================================================= */

.sparkle {
    position: absolute;

    z-index: 30;

    color: white;

    font-size: 22px;

    animation: sparkle 2s ease-in-out infinite;

    text-shadow:
        0 0 10px white,
        0 0 20px #ff4f9a;
}

.sparkle.one {
    top: 20%;
    left: 23%;
}

.sparkle.two {
    top: 28%;
    right: 21%;

    animation-delay: .7s;
}

.sparkle.three {
    bottom: 28%;
    left: 27%;

    animation-delay: 1.2s;
}

.sparkle.four {
    bottom: 23%;
    right: 26%;

    animation-delay: 1.7s;
}

@keyframes sparkle {

    0%,
    100% {
        transform: scale(.5) rotate(0deg);
        opacity: .25;
    }

    50% {
        transform: scale(1.3) rotate(25deg);
        opacity: 1;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

    .card {
        height: 90vh;
        border-radius: 30px;
    }

    .heart-wrapper {
        transform: scale(.8);
    }

    .subtitle {
        bottom: 35px;
        font-size: 11px;
    }
}

</style>
</head>


<body>

<!-- BACKGROUND -->
<div class="background-glow"></div>

<!-- STARS -->
<div class="stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>


<!-- FLOATING HEARTS -->
<div class="floating-hearts">

    <div class="floating-heart">♥</div>
    <div class="floating-heart">♥</div>
    <div class="floating-heart">♥</div>
    <div class="floating-heart">♥</div>
    <div class="floating-heart">♥</div>

</div>


<!-- MAIN -->
<div class="card">

    <div class="heart-wrapper">

        <div class="sparkle one">✦</div>
        <div class="sparkle two">✦</div>
        <div class="sparkle three">✧</div>
        <div class="sparkle four">✧</div>

        <div class="heart">

            <div class="heart-text">
                V + D ❤️
            </div>

        </div>

        <div class="heart-highlight"></div>

    </div>

    <div class="subtitle">
        Forever & Always
    </div>

</div>


<script>

/* =========================================================
   EXTRA PARTICLES
========================================================= */

const container = document.querySelector(".floating-hearts");

for (let i = 0; i < 12; i++) {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML = Math.random() > .5 ? "♥" : "♡";

    heart.style.left = Math.random() * 100 + "%";

    heart.style.fontSize =
        (12 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 8) + "s";

    heart.style.animationDelay =
        Math.random() * 8 + "s";

    container.appendChild(heart);
}


/* =========================================================
   CLICK HEART EFFECT
========================================================= */

document.addEventListener("click", function(e) {

    for (let i = 0; i < 8; i++) {

        const particle = document.createElement("div");

        particle.innerHTML = "♥";

        particle.style.position = "fixed";

        particle.style.left = e.clientX + "px";
        particle.style.top = e.clientY + "px";

        particle.style.color = "#ff3975";

        particle.style.fontSize =
            (12 + Math.random() * 18) + "px";

        particle.style.pointerEvents = "none";

        particle.style.zIndex = "9999";

        document.body.appendChild(particle);

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            50 + Math.random() * 100;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        particle.animate(
            [
                {
                    transform: "translate(-50%, -50%) scale(1)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        )
                        scale(0)`,
                    opacity: 0
                }
            ],
            {
                duration: 900 + Math.random() * 500,
                easing: "cubic-bezier(.2,.8,.3,1)"
            }
        );

        setTimeout(() => {
            particle.remove();
        }, 1500);
    }

});

</script>

</body>
</html>
